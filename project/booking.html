<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<style>
    #booking{
        padding-top: 30px;
    }
    .row{
        display: flex;
        gap: 15px;
        margin-bottom: 15px;
    }
    .details{
        padding:10px;
        border:2px solid red;
        border-radius: 5px;
    }
    #place{
        width:100%;
        gap: 15px;
        display: flex;
        padding:10px;
        border:2px solid red;
        border-radius: 5px;
    }
    /* #select:hover{
        background-color: red;
        color: white;

    } */
    textarea{
        width: 100%;
        height:80px;
        border: 1px solid red;
        border-radius: 5px;
        margin-top: 10px;
    }
</style>
</head>
<body>
    <nav class="navbar bg-danger">
        <div class="container-fluid">
        <h4 style="color: white;">Book Now.....</h4>
        </div>
    </nav>

        <div id="booking" class="mb-5">
            <div class="container-fluid">
                <div class="row justify-content-center">
                    <div class="col-xl-6">
                        <div class="p-5 border border-3 border-danger rounded shadow">
                            <form>
                               <div class="row">
                                    <input class="details" type="text" placeholder="Name">
                                    <input class="details" type="email" placeholder="Email">
                                    <input class="details" type="text" placeholder="Phone">
                                </div>

                                 <select name="" id="place" >
                                    <option value="">Select place</option>
                                    <option value="" id="select">Palakkad</option>
                                    <option value="" class="select">Thrissur</option>
                                    <option value="" class="select">Ernakulam</option>
                                    <option value="" class="select">Kozhikode</option>
                                </select>
                                <br>
                                <br>
                                
                              <div class="type">
                                <label for="">Event Type:</label><br>
                                    <label><input type="radio" name="event"> Wedding</label>
                                    <label><input type="radio" name="event"> Birthday</label>
                                    <label><input type="radio" name="event"> Corporate</label>
                                    <label><input type="radio" name="event"> Others</label>
                              </div>
                              
                            
                            
                            <textarea  >Any Special Request</textarea>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-danger btn-lg">Book Now</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>



</body>
</html>
